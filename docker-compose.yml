services:
  postgres:
    image: postgres:16-alpine
    container_name: libraryservice-postgres
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - libraryservice-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d libraryservice"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - postgres

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: library-api
    container_name: libraryservice-api
    env_file:
      - .env.local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../IdentityServer-FE
      dockerfile: Dockerfile
    image: library-fe
    container_name: libraryservice-fe
    env_file:
      - ../IdentityServer-FE/.env.docker
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  libraryservice-pgdata:

networks:
  default:
    name: libraryservice-local
